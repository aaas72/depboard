name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Time to first insight on 30 generated projects against a local registry with latency.
      - name: Performance budgets
        run: pnpm perf

  # Users may run the published CLI on Node 20.19+, even though our dev tooling needs Node 22.
  # Build on Node 22, then run the built CLI on Node 20.
  runtime-node20:
    name: Runtime smoke test (${{ matrix.os }}, Node 20)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19'
      - run: node --version
      - run: node packages/cli/dist/index.js --version
      - run: node packages/cli/dist/index.js --help
      - name: Scan and server smoke test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/p/a" "$RUNNER_TEMP/p/b"
          echo '{"name":"a","dependencies":{"react":"^18.0.0"}}' > "$RUNNER_TEMP/p/a/package.json"
          echo '{"name":"b","dependencies":{"react":"^19.0.0"}}' > "$RUNNER_TEMP/p/b/package.json"
          node packages/cli/dist/index.js "$RUNNER_TEMP/p" --summary | grep -q "2 projects"
          node scripts/smoke-server.mjs packages/cli/dist/index.js "$RUNNER_TEMP/p"

  package-contents:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Same script as `pnpm ci:local`, so local and GitHub CI never drift apart.
      - name: Only dist/ and metadata may be published, within the size budget
        run: pnpm check:package
